<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!--Google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <!--Arcchivo JS-->
    <script src="HojaR.js" defer></script>
    <!--Archivo CSS-->
    <link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/bc51cbe2c5.js" crossorigin="anonymous"></script>    <title>Hoja Random</title>

</head>

<body>
    <!-- Modal de configuración -->
    <div class="modal fade" id="configModal" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <section class="titulo">
                    <h5 class="modal-title" id="configModalLabel">Configuración</h5>
                </section>

                <div>
                    <p>Selecciona el tamaño de la hoja *</p>
                </div>
                <section class="opciones">
                    <div>
                        <button type="button" class="btn">5:5</button>
                        <button type="button" class="btn">6:6</button>
                        <button type="button" class="btn">7:6</button>
                        <button type="button" class="btn">8:6</button>
                    </div>
                </section>

                <div>
                    <p>Selecciona las opciones de acordes</p>
                </div>

                <section class="acordes">
                    <div>
                        <label for="AMenores" class="nombreAcordes">Acordes menores</label>
                        <input id="AMenores" type="checkbox">
                    </div>
                    <div>
                        <label for="ASostenidos" class="nombreAcordes">Sostenidos (#)</label>
                        <input id="ASostenidos" type="checkbox">
                    </div>
                    <div>
                        <label for="ABemoles" class="nombreAcordes">Bemoles (b)</label>
                        <input id="ABemoles" type="checkbox">
                    </div>
                </section>

                <section class="botonesAjustes">
                    <div class="VolverInicio">
                        <a class="BotonSecundario" href="index.html">Volver al inicio</a>
                    </div>

                    <div>
                        <button class="BotonPrimario" type="button" class="btn btn-primary" id="aplicarBtn"
                            onclick="GenerarMatriz()">Aplicar</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

    <div id="HojaRandom" class="container my-10 p-3 rounded shadow-sm">
        <!-- Aquí se va a generar las notas aleatorias -->
    </div>

    <button class="Boton" onclick="GenerarMatriz()">
        ¡Generar acordes!
    </button>

    <section class="iconos-menu">
            <a href="index.html"><i class="fa-solid fa-house" ></i></a>
            <i class="fa-solid fa-gear" data-bs-toggle="modal" data-bs-target="#configModal"></i>
    </section>
</body>

</html>
