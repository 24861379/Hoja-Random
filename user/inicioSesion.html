<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Zen+Tokyo+Zoo&display=swap"
        rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="inicioSesion.css">
    
    <!--iconos de font awesome-->
    <script src="https://kit.fontawesome.com/bc51cbe2c5.js" crossorigin="anonymous"></script>
    
    <link rel="icon" href="/img/LogoVibesRiff.png" type="image/png">

    <script src="InicioSesion.js" defer></script>
</head>
<body>
    <section class="login-container">
        <!-- <div class="circulo">
            <i class="fa-regular fa-user user"></i>
        </div> -->

        <h2>Iniciar Sesión</h2>
        <form action="#" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Correo electrónico" required >
                <div class="invalid-feedback">
                    Por favor ingresa tu correo electrónico.
                </div>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required fdfgh>
                <div class="invalid-feedback">
                    Por favor ingresa tu contraseña.
                </div>
                <a class="ayuda">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="botones">
                <a class="BotonSecundario" href="#">Crear cuenta</a>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
        </form>
    </section>
    
</body>
</html>
